# Basic config for FigWiz.
# The .mat file contains raw arrays. This file defines what they mean and how to plot them.

data:
  file: data/nominal.mat
  time: t

output:
  html_dir: outputs/html

signals:
  tcp_pos_err:
    source: TCP_pos_err
    kind: vector
    components: [x, y, z]
    unit: cm

  tcp_rot_err:
    source: TCP_rot_err
    kind: vector
    components: [alpha, beta, gamma]
    unit: deg

  kin_energy:
    source: kin_energy
    kind: scalar
    unit: J

  momentum:
    source: momentum
    kind: vector
    components: [px, py, pz, hx, hy, hz]
    unit: momentum

figures:
  - name: tcp_position_error
    title: TCP position error
    signal: tcp_pos_err
    plot: timeseries
    y_label: position error [cm]
    processing:
      crop: [7, 50]
      scale: 100
    events:
      - time: 20
        label: contact

  - name: tcp_rotation_error
    title: TCP rotation error
    signal: tcp_rot_err
    plot: timeseries
    y_label: rotation error [deg]
    processing:
      crop: [7, 50]
      scale: 57.2957795131

  - name: kinetic_energy
    title: Kinetic energy
    signal: kin_energy
    plot: timeseries
    y_label: kinetic energy [J]
    processing:
      crop: [7, 50]

  - name: momentum_norm
    title: Momentum norm
    signal: momentum
    plot: timeseries
    y_label: momentum norm
    processing:
      crop: [7, 50]
      norm: true
