[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "figwiz"
version = "0.1.0"
description = "Configuration-driven MATLAB experiment figure tool"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "plotly>=5.18",
    "typer>=0.9",
    "rich>=13.0"
]

[project.scripts]
figwiz = "figwiz.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["figwiz*"]

[tool.setuptools.package-data]
figwiz = ["templates/*.yaml"]
